[package]
name = "obs-vendored-tests"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Regression guards over the vendored OBS, DistroAV and plugin sources (moved from camera-box, obs#1)"

# No library and no runtime dependencies: every check is an integration test under tests/.
# Paths resolve from the repo root (CARGO_MANIFEST_DIR/../..), so `vendor/...`, `tests/c/...`
# and `tests/fixtures/...` read exactly as they did in camera-box.

# A standalone crate, not a member of any parent workspace.
[workspace]

[dev-dependencies]
# Scratch directories for the harness builds (camera-box used the same crate).
tempfile = "3.9"
# obs#62: vstack's rig-core, the Rust authority of the vendored C genlock twins (the parity tests).
# Its tag must equal vstack.pin's (vstack_pin_and_rig_core_tag_agree checks it).
rig-core = { git = "https://github.com/zbynekdrlik/vstack", tag = "v0.1.17" }
