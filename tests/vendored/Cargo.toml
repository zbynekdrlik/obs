[package]
name = "obs-vendored-tests"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Regression guards over the vendored OBS, DistroAV and plugin sources (moved from camera-box, obs#1)"

# No library and no dependencies: every check is a std-only integration test under tests/.
# Paths resolve from the repo root (CARGO_MANIFEST_DIR/../..), so `vendor/...`, `tests/c/...`
# and `tests/fixtures/...` read exactly as they did in camera-box.

# A standalone crate, not a member of any parent workspace.
[workspace]

[dev-dependencies]
# Scratch directories for the harness builds (camera-box used the same crate).
tempfile = "3.9"
