[package]
name = "dante-input-ffi"
version = "0.4.12"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "The C ABI under the OBS dante_input source: a dlink device (dstack) whose RX blocks reach OBS"

[lib]
name = "dante_input_ffi"
# staticlib for the OBS plugin; rlib for the tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
# obs#1 / camera-box#1485: the Dante device an app embeds. The tag is the only pin; dstack moves it.
# v0.5.20: network_rate, the 2:1 step from the 96 kHz network to the app's rate (dstack #90).
# v0.6.8: the RX ring counts a sample the reader overtook mid-write as late (dstack #99).
# v0.6.10: the clock follower seeds from the dsync service and keeps it until it settles (dsync-ptp v1.27.3).
# v0.6.22: latency_ms is the budget of each direction's whole path, split by dlink (dstack #68).
# v0.6.23: dstack's other entry points follow Dante PTP in process too; dlink already did (camera-box#1485).
# v0.6.24: an RX-only device sizes P by RX work alone; the pump margin W widens (4 ms at 10 ms) against contention gaps (intercom).
# v0.6.25: a once-a-second WARN when the engine pump lost or overran blocks (camera-box#1485).
# v0.6.26: no change dante-input uses. Its CPU keys stay unused: the owner ruled CPU pinning out (dstack#1, 4.11.2026).
dlink = { git = "https://github.com/zbynekdrlik/dstack", tag = "v0.6.26" }
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tempfile = "3"

# A crate of its own, not a member of any parent workspace.
[workspace]

[profile.release]
lto = true
codegen-units = 1

# dstack v0.6.25 (dlink's "Debug builds with a rate converter"): a converting device (96 kHz
# network, 48 kHz OBS) runs dstack-resample over rubato inside the pump's block; unoptimised it
# overruns every block in a debug build or `cargo test`. Cargo takes profiles only from this,
# the top workspace.
[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.dstack-resample]
opt-level = 3
