[package]
name = "dante-input-ffi"
version = "0.4.28"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "The C ABI under the OBS dante_input source: a dlink device (dstack) whose RX blocks reach OBS"

[lib]
name = "dante_input_ffi"
# staticlib for the OBS plugin; rlib for the tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
# obs#1 / camera-box#1485: the Dante device an app embeds. The tag is the only pin; dstack moves it.
# v0.5.20: network_rate, the 2:1 step from the 96 kHz network to the app's rate (dstack #90).
# v0.6.8: the RX ring counts a sample the reader overtook mid-write as late (dstack #99).
# v0.6.10: the clock follower seeds from the dsync service and keeps it until it settles (dsync-ptp v1.27.3).
# v0.6.22: latency_ms is the budget of each direction's whole path, split by dlink (dstack #68).
# v0.6.23: dstack's other entry points follow Dante PTP in process too; dlink already did (camera-box#1485).
# v0.6.24: an RX-only device sizes P by RX work alone; the pump margin W widens (4 ms at 10 ms) against contention gaps (intercom).
# v0.6.25: a once-a-second WARN when the engine pump lost or overran blocks (camera-box#1485).
# v0.6.26: no change dante-input uses.
# v0.6.28: the default budget is 15 ms (owner 4.11.2026, dstack#1); a half-band 2:1 converter (RX 0.625 ms at 96/48); no CPU pinning API.
# v0.6.31: no latency change; the switch to the in-process PTP follower is seamless, a sub-sample re-anchor is absorbed (camera-box).
# v0.6.32: an RX-only device gets W = the whole budget (15 ms = 1440 samples at 96 kHz), so a 6 ms preemption no longer restarts the pump; P unchanged (camera-box#1485).
# v0.6.33: dsync-ptp v1.27.4 fixes the 0.48 ms follower offset on strih; no API or latency change (camera-box).
# v0.6.45: the fixed Dante RX flow ports bind before the TX sockets, so a restart no longer fails with "RX flow port 47217: Address already in use"; no API or latency change (camera-box).
# v0.6.56: a subscription is resolved by direct mDNS queries, no whole-service browse (dstack #141); for stream-obs subscribing mbc-snv (camera-box issue 1495). No latency change.
# v0.6.67: an unanswered Dante flow request is retried 6 s after it instead of after the full backoff (dstack #20); on stream-snv 10.11.2026 dante_input came back ~10 s after mbc following a NIC restart (camera-box). No API or latency change.
# v0.6.78: dsync-ptp v1.29.0 measures the PTP phase on the delay floor, so one-sided late receive stamps under OBS load no longer move it; on strih-snv 10.11.2026 dsync lost its phase lock every 2-15 min with OBS at ~600 % CPU (camera-box). No API or latency change.
# v0.6.101: per RX flow on Linux, wire_late and the RX thread's wake delay (SO_TIMESTAMPNS), on the status line (dstack #234, camera-box#1510). Passes v0.6.99 (Link::start fails fast again; v0.6.98 skipped) and dsync-ptp v1.33.1. Additive API, no latency change.
# v0.6.103: dlink::bridge (Fifo + the ASRC Player, moved from dstack-endpoint without cpal) for the TX of an OBS track (dstack #241, obs#41). Additive API; a device with TX splits its budget for both directions.
# v0.6.106: latency in named terms (dstack #244): (a) network latency + (b) receive buffer = P, the app hand-off and W stated; Config::budget_ns and BUDGET_NS are gone, so dante-input.toml's latency_ms is replaced by network_latency_ms / receive_buffer_ms. Neither set: no latency change. BREAKING for the file.
# v0.6.112: the bridge FIFO's target is the app buffer, derived from the producer's chunk + one pump block (dstack #247): OBS's 1024 frames at 48 kHz + 1.333 ms = 22.667 ms on a 96 kHz device, not a fixed 40 ms. Config::app_buffer / bridge_buffer; Player::new takes the buffer. Breaking for the bridge only.
dlink = { git = "https://github.com/zbynekdrlik/dstack", tag = "v0.6.112" }
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tempfile = "3"

# A crate of its own, not a member of any parent workspace.
[workspace]

[profile.release]
lto = true
codegen-units = 1

# dstack v0.6.25 (dlink's "Debug builds with a rate converter"): a converting device (96 kHz
# network, 48 kHz OBS) runs dstack-resample over rubato inside the pump's block; unoptimised it
# overruns every block in a debug build or `cargo test`. Cargo takes profiles only from this,
# the top workspace.
[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.dstack-resample]
opt-level = 3
