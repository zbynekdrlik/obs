[package]
name = "dante-input-ffi"
version = "0.4.9"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "The C ABI under the OBS dante_input source: a dlink device (dstack) whose RX blocks reach OBS"

[lib]
name = "dante_input_ffi"
# staticlib for the OBS plugin; rlib for the tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
# obs#1 / camera-box#1485: the Dante device an app embeds. The tag is the only pin; dstack moves it.
# v0.5.20: network_rate, the 2:1 step from the 96 kHz network to the app's rate (dstack #90).
# v0.6.8: the RX ring counts a sample the reader overtook mid-write as late (dstack #99).
# v0.6.10: the clock follower seeds from the dsync service and keeps it until it settles (dsync-ptp v1.27.3).
# v0.6.22: latency_ms is the budget of each direction's whole path, split by dlink (dstack #68).
# v0.6.23: dstack's other entry points follow Dante PTP in process too; dlink already did (camera-box#1485).
dlink = { git = "https://github.com/zbynekdrlik/dstack", tag = "v0.6.23" }
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tempfile = "3"

# A crate of its own, not a member of any parent workspace.
[workspace]

[profile.release]
lto = true
codegen-units = 1
