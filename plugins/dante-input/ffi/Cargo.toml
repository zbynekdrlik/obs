[package]
name = "dante-input-ffi"
version = "0.4.62"
edition = "2024"
# Let-chains (src/lib.rs Sink::process, obs#53).
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false
description = "The C ABI under the OBS dante_input source: a dlink device (dstack) whose RX blocks reach OBS"

[lib]
name = "dante_input_ffi"
# staticlib for the OBS plugin; rlib for the tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
# obs#1 / camera-box#1485: the Dante device an app embeds. The tag is the only pin; dstack moves it.
# v0.5.20: network_rate, the 2:1 step from the 96 kHz network to the app's rate (dstack #90).
# v0.6.8: the RX ring counts a sample the reader overtook mid-write as late (dstack #99).
# v0.6.10: the clock follower seeds from the dsync service and keeps it until it settles (dsync-ptp v1.27.3).
# v0.6.22: latency_ms is the budget of each direction's whole path, split by dlink (dstack #68).
# v0.6.23: dstack's other entry points follow Dante PTP in process too; dlink already did (camera-box#1485).
# v0.6.24: an RX-only device sizes P by RX work alone; the pump margin W widens (4 ms at 10 ms) against contention gaps (intercom).
# v0.6.25: a once-a-second WARN when the engine pump lost or overran blocks (camera-box#1485).
# v0.6.26: no change dante-input uses.
# v0.6.28: the default budget is 15 ms (owner 4.11.2026, dstack#1); a half-band 2:1 converter (RX 0.625 ms at 96/48); no CPU pinning API.
# v0.6.31: no latency change; the switch to the in-process PTP follower is seamless, a sub-sample re-anchor is absorbed (camera-box).
# v0.6.32: an RX-only device gets W = the whole budget (15 ms = 1440 samples at 96 kHz), so a 6 ms preemption no longer restarts the pump; P unchanged (camera-box#1485).
# v0.6.33: dsync-ptp v1.27.4 fixes the 0.48 ms follower offset on strih; no API or latency change (camera-box).
# v0.6.45: the fixed Dante RX flow ports bind before the TX sockets, so a restart no longer fails with "RX flow port 47217: Address already in use"; no API or latency change (camera-box).
# v0.6.56: a subscription is resolved by direct mDNS queries, no whole-service browse (dstack #141); for stream-obs subscribing mbc-snv (camera-box issue 1495). No latency change.
# v0.6.67: an unanswered Dante flow request is retried 6 s after it instead of after the full backoff (dstack #20); on stream-snv 10.11.2026 dante_input came back ~10 s after mbc following a NIC restart (camera-box). No API or latency change.
# v0.6.78: dsync-ptp v1.29.0 measures the PTP phase on the delay floor, so one-sided late receive stamps under OBS load no longer move it; on strih-snv 10.11.2026 dsync lost its phase lock every 2-15 min with OBS at ~600 % CPU (camera-box). No API or latency change.
# v0.6.101: per RX flow on Linux, wire_late and the RX thread's wake delay (SO_TIMESTAMPNS), on the status line (dstack #234, camera-box#1510). Passes v0.6.99 (Link::start fails fast again; v0.6.98 skipped) and dsync-ptp v1.33.1. Additive API, no latency change.
# v0.6.103: dlink::bridge (Fifo + the ASRC Player, moved from dstack-endpoint without cpal) for the TX of an OBS track (dstack #241, obs#41). Additive API; a device with TX splits its budget for both directions.
# v0.6.106: latency in named terms (dstack #244): (a) network latency + (b) receive buffer = P, the app hand-off and W stated; Config::budget_ns and BUDGET_NS are gone, so dante-input.toml's latency_ms is replaced by network_latency_ms / receive_buffer_ms. Neither set: no latency change. BREAKING for the file.
# v0.6.112: the bridge FIFO's target is the app buffer, derived from the producer's chunk + one pump block (dstack #247): OBS's 1024 frames at 48 kHz + 1.333 ms = 22.667 ms on a 96 kHz device, not a fixed 40 ms. Config::app_buffer / bridge_buffer; Player::new takes the buffer. Breaking for the bridge only.
# v0.6.118: fixed flow ports from the device's slot in the dstack flow range 29800-31847 (dstack #264, owner 13.11.2026), so one generic Dante-leg filter fits every PC; an unset rx_port_base now means the slot's own block. A device whose ARC port is no slot's (4440-4471) must set both bases. RX status names the transmitter (dstack #266).
# v0.6.125: a reordered RX packet fills its hole and counts as reordered, so gaps/gap_frames (rx_gaps/rx_loss) count only holes still open at playout (dstack #278, camera-box issue 1508); a once-a-minute INFO line per RX flow gives the wake delay p50/p99/p99.9/max and the network latency (dstack #234, camera-box issue 1510). RxCounts gains reordered. No latency change.
# v0.6.126: a ring hole read before its flow's first sample counts as start_holes, not holes, so rx_holes no longer holds the OBS-start burst; the minute timing line adds the write delay, and a minute line names each flow's holes (dstack #234, camera-box issue 1510). Counters gains start_holes. No latency change.
# v0.6.132: each RX block carries its play time in the app clock (Block::play_at, CLOCK_MONOTONIC / QPC ns = os_gettime_ns): the block's first sample + P + (c), recomputed per block from a fresh media/monotonic pair, so stamps follow the media-vs-monotonic drift continuously (dstack#295, obs#53, camera-box issue 1527). Passes v0.6.127-0.6.131. No latency change.
# v0.6.135: play_at's media/app clock pair is filtered (a torn pair over 50 us rejected, the slew bounded, a persistent step taken on the 3rd wake), so its +-1-2 ms pair jitter is gone (dstack#295); status engine.play_at_rejected, INFO `play_at: torn clock pair reads rejected in the last minute`, WARN `play_at: the media clock's offset from the app's clock stepped`. For the dstack#303 bisect (b), obs#56; not dstack's production tag. Passes v0.6.133 (arc_rx_fpp Option, no literal here) and v0.6.134. No latency change.
# v0.6.136: dstack#303 fix, the bridge Player resyncs a block that does not start where the last ended (fill_at with the block start), follows OBS's 1024-frame tick schedule on a re-prime, and bounds its level loop at 20 ppm once locked; passed dstack#304's release soak (Release run 43633305590). Carries v0.6.135's filtered play_at. No latency change.
# v0.6.137: Config::test_clock_ppm (TEST ONLY: the system clock with a skew) and the dstack-dev peer for the obs#57 soak gate (dstack#305); status engine.play_at_steps / play_at_max_dev_us (PumpView); the player resyncs on a None-to-Some block start (dstack#303). Passed dstack's soak gate. No latency change.
# v0.6.143: dstack#303, part two: the bridge Player stamps each FIFO push and steers on the producer line, so a 128-frame level read no longer aliases with OBS's 1024-frame grid (v0.6.140 removed the floor re-centre but its loop froze, then braked at 20 ppm, obs#56). The dstack-dev peer logs each tone break. No producer API change, no latency change.
# v0.6.144: v0.6.143's producer line unchanged; a pump-fed player knows its real producer chunk, dante-input's TX keeps OBS's 1024 frames (dstack #317); a fresher app status. Player::new takes the producer's chunk (OBS's 1024 frames); no latency change.
# v0.6.148: dstack#326: in the normal profile the engine pump drains the RX sockets and writes the RX rings itself, so a late RX helper thread on a loaded PC no longer leaves written_late holes (strih-snv, camera-box#1534); the wake/write delay figures now read up to a block higher. v0.6.145-147: additive APIs, bridge convert_errors count, the peer tone-break kind, a Windows test-clock fix (dstack#328). No latency change, nothing to port.
# v0.6.155: dstack#345: the heartbeat's peaks record (0x8002) carries its padding in its length, so dcontroller and Dante Controller read the latency records of a device whose TX+RX channel count is not a multiple of 4 (strih-obs: 2). v0.6.149-154: ASIO-bridge and dlisten pull APIs (RxPull::new returns Result; obs does not pull), Rated output zeroing, test fixes. No latency change, nothing to port.
# v0.6.159: dstack#354: the pump watch splits a lost second (oversleep_max_us, drain_max_us, drain_max_datagrams, max_process_cpu_us), which obs#71's soak verdict reads. v0.6.156-158: per-slot mean packet age, writes_after_send (#346), a latency write reaching running flows (#352), arrival-time lateness (#350), Rated's exact timeline across a re-bootstrap (#343), a Windows media spin fix (#351). No latency change, nothing to port.
# v0.6.161: dstack#358: the test peer re-locks its tone check at its own pump's skip and counts it as own_skips, never in tone_gaps (the soak gates own_skips); dstack#359: `the TX schedule starts again` carries oversleep_us, last_pass_us, last_pass_cpu_us. v0.6.160: info-server fixes. No latency change, nothing to port.
# v0.6.170: dstack#379: an RX channel no longer stays silent after the media clock steps back to another time base (stream-obs 16.11.2026: every sample a late hole for ~24 h after a -43.9-day re-anchor until an OBS restart). v0.6.162-169: internal splits, the TX pull (#363, opt-in, not used here), test-run loopback (#366). No latency change, nothing to port.
# v0.6.178 (dstack#399, one dstack version across apps): v0.6.171 Stats output_gaps()/output_lost_frames() and a held output callback no longer underruns a pulled RX bridge (#307; our push-and-fill RX unchanged); v0.6.172 ASRC seed (new methods only); v0.6.176 the 8700 relay of a dasio bridge's figures; v0.6.177-178 dstack-asio only. No API break, no latency change.
# v0.6.181 (obs#84): dstack#409 a device finds its transmitters again after its NIC is re-created (stream-snv USB reset: 23 min silent until restart); dstack#410 play_at no longer counts the RX converter delay twice (dstack: the audio reaches OBS as before, its stamp 0.625 ms earlier at 48 kHz on 96 kHz). No API change.
# v0.6.213 (obs#96): dstack#476 each RX block reaches the app 30 % of P before its play_at (the pump handed it AT play_at + its wake delay: strih-snv min_lead_us p50 -2.8 ms), the engine pump and TX thread take a 200 us EEVDF slice (#302), mDNS announces again after a NIC re-create. No config change, no latency change; the API notes 0.6.182-0.6.213 touch nothing dante-input calls.
dlink = { git = "https://github.com/zbynekdrlik/dstack", tag = "v0.6.213" }
# obs#94: clock_gettime(CLOCK_MONOTONIC), os_gettime_ns's clock, for the hand-off lead.
libc = "0.2"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tempfile = "3"

# A crate of its own, not a member of any parent workspace.
[workspace]

[profile.release]
lto = true
codegen-units = 1

# dstack v0.6.25 (dlink's "Debug builds with a rate converter"): a converting device (96 kHz
# network, 48 kHz OBS) runs dstack-resample over rubato inside the pump's block; unoptimised it
# overruns every block in a debug build or `cargo test`. Cargo takes profiles only from this,
# the top workspace.
[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.dstack-resample]
opt-level = 3
