name: Linux genlock build (vendored OBS + DistroAV, imag-nb parity)

# camera-box #460: builds the vendored, genlock-patched OBS 32.2.0 + DistroAV for LINUX
# (imag-nb, Ubuntu 24.04/noble) — the user mandates the CUSTOM genlock stack on imag-nb; the
# stock DistroAV bootstrap there was only ever a placeholder. Research (2026-07-03, issue #460)
# found the patch surface is ALREADY Linux-ready — every genlock/DistroAV patch that touches
# platform-specific code already carries a working non-Windows fallback branch (clock_gettime /
# dlsym / gethostname / std::chrono) — so this workflow is pure CI-workflow authoring, ZERO
# source porting.
#
# SCOPE: this workflow only BUILDS + uploads the Linux genlock artifacts and proves they build
# green. Deploying the built artifact to imag-nb (replacing its stock DistroAV bootstrap,
# /opt/obs-genlock) is #458's remaining scope, NOT this workflow's.
#
# Mirrors windows-genlock.yml's overall shape. The dozens of pwsh "assert genlock patch present"
# guard steps in the Windows workflows exist ONLY because PowerShell can't run `cargo test` — the
# SAME vendored-source assertions already run as real Rust tests on every push via ci.yml's `test`
# job (tests/genlock_preload.rs, distroav_genlock_lockdown.rs, obs_titlebar_newlevel.rs,
# burn_payload_parity.rs, distroav_timecode_patch.rs, distroav_source_config_lock.rs,
# obs_updater_disabled.rs, av_sync_dock_qr_patch_guard.rs — see tests/*.rs), so this Linux
# workflow does NOT duplicate them as text-token guards. What THIS workflow proves that ci.yml
# cannot: that the vendored C/C++ — including every non-Windows fallback branch the genlock
# patches carry — actually COMPILES with gcc/g++ on Linux. ENABLE_BROWSER stays OFF for both jobs
# (imag-nb needs no browser source; this also means the workflow never downloads/builds CEF, the
# dominant time cost on the Windows builds — no obs-deps prebuilt bundle is needed on Linux
# either, apt supplies everything per vendor/obs-studio/.github/scripts/build-ubuntu).

on:
  workflow_dispatch:
  push:
    branches: [dev]
    # obs#1 point 1: a tag vX.Y.Z on main builds the strih bundle and publishes it as a release
    # (publish-release job below). GitHub does not apply the paths filter to tag pushes.
    tags: ['v*']
    paths:
      - 'vendor/obs-studio/**'
      - 'vendor/distroav/**'
      # issue 1439: the strih variant builds the vendored obs-vban (the VBAN receive source).
      - 'vendor/obs-vban/**'
      # issue 1470: the strih variant builds the A/V-sync dock.
      - 'vendor/av-sync-dock/**'
      # camera-box#1436: the strih variant builds the loudness dock (the stream operator's LUFS meter).
      - 'vendor/obs-loudness-dock/**'
      - 'scripts/genlock-manifest.sh'
      - 'scripts/genlock-runtime-packages.sh'
      # issue 1387 + camera-box#1487: the strih variant links the JPEG XS C ABIs (jxs-recv-ffi, which
      # carries jxs-send-ffi) into DistroAV's JPEG XS source and program output. They come from the
      # vstack tag in vstack.pin; a pin change can move the native-library list or break the link.
      - 'vstack.pin'
      # obs#1 / camera-box#1485: the dante_input source (C) and its Rust device (dlink).
      - 'plugins/**'
      # camera-box#1387: the libobs and obs-websocket tests the strih job builds and runs.
      - 'tests/**'
      - '.github/workflows/linux-genlock.yml'
      - '.github/actions/**'

permissions:
  contents: read

concurrency:
  group: linux-genlock-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tested apt list for this exact vendored OBS version, verbatim from
  # vendor/obs-studio/.github/scripts/build-ubuntu (the setup_ubuntu function) — PLUS
  # ninja-build/ccache/pkg-config, which upstream's own CI installs separately via its
  # `.Aptfile` prerequisite step (before setup_ubuntu ever runs) rather than inside
  # setup_ubuntu itself. cmake/curl/git/jq (the .Aptfile's other prerequisites) are already
  # present on the GitHub-hosted ubuntu-24.04 runner image.
  OBS_APT_PACKAGES: >-
    ninja-build ccache pkg-config
    build-essential libglib2.0-dev
    extra-cmake-modules lsb-release dh-cmake
    libcurl4-openssl-dev
    libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev
    libswresample-dev libswscale-dev
    libjansson-dev
    libx11-xcb-dev
    libgles2-mesa-dev
    libwayland-dev
    libpipewire-0.3-dev
    libpulse-dev
    libx264-dev
    libmbedtls-dev
    libgl1-mesa-dev
    uthash-dev
    libsimde-dev
    libluajit-5.1-dev python3-dev
    libx11-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev
    libxcb-composite0-dev libxinerama-dev libxcb1-dev libxcb-xfixes0-dev
    swig libcmocka-dev libxss-dev libglvnd-dev
    libxkbcommon-dev libatk1.0-dev libatk-bridge2.0-dev libxcomposite-dev libxdamage-dev
    libasound2-dev libfdk-aac-dev libfontconfig-dev libfreetype6-dev libjack-jackd2-dev
    libsndio-dev libspeexdsp-dev libudev-dev libv4l-dev libva-dev libvlc-dev
    libpci-dev libdrm-dev libgbm-dev libvulkan-dev
    nlohmann-json3-dev libwebsocketpp-dev libasio-dev libqrcodegencpp-dev
    libffmpeg-nvenc-dev librist-dev libsrt-openssl-dev
    qt6-base-dev libqt6svg6-dev qt6-base-private-dev
    libvpl-dev libvpl2

jobs:
  # THE FIRST job (per #460): proves the vendored C/C++ — every non-Windows fallback branch the
  # genlock patches carry — actually compiles on Linux. Narrowed on PURPOSE so it is genuinely
  # fast: DistroAV only needs libobs + obs-frontend-api (obs-frontend-api itself needs only
  # libobs, no Qt — frontend/api/CMakeLists.txt) — ENABLE_FRONTEND=OFF skips the large Qt GUI
  # app compile (frontend/CMakeLists.txt still builds obs-frontend-api FIRST, unconditionally,
  # before its own ENABLE_FRONTEND check) and ENABLE_PLUGINS=OFF skips every bundled OBS plugin
  # (obs-ffmpeg, obs-outputs, obs-websocket, decklink, …) DistroAV does not link against.
  # ENABLE_BROWSER=OFF is OBS's own upstream default already and is redundant once
  # ENABLE_PLUGINS=OFF short-circuits plugins/CMakeLists.txt (obs-browser lives there), but is
  # passed explicitly for documentation.
  linux-distroav-compile-check:
    name: Vendored OBS/DistroAV C++ compile gate (Linux, #460)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.OBS_APT_PACKAGES }}

      - name: Configure OBS (ubuntu-ci preset, narrowed for the compile-check lane)
        working-directory: vendor/obs-studio
        run: >
          cmake --preset ubuntu-ci
          '-DOBS_VERSION_OVERRIDE=32.2.0'
          -DENABLE_BROWSER=OFF
          -DENABLE_FRONTEND=OFF
          -DENABLE_PLUGINS=OFF

      - name: Build OBS (libobs + obs-frontend-api only, narrowed)
        working-directory: vendor/obs-studio
        run: cmake --build build_ubuntu --parallel

      - name: Install OBS SDK prefix (+ Development component, the #392 trick)
        working-directory: vendor/obs-studio
        run: |
          cmake --install build_ubuntu --prefix "$GITHUB_WORKSPACE/obs-sdk"
          # #392 trick (mirrors windows-genlock.yml): the default install omits the
          # EXCLUDE_FROM_ALL "Development" component (libobsConfig.cmake /
          # obs-frontend-apiConfig.cmake + headers) that DistroAV's config-mode
          # find_package(libobs)/find_package(obs-frontend-api) need to resolve — install it
          # explicitly. Platform-agnostic: cmake/common/helpers_common.cmake.
          cmake --install build_ubuntu --prefix "$GITHUB_WORKSPACE/obs-sdk" --component Development

      - name: Configure DistroAV against the genlocked OBS SDK
        working-directory: vendor/distroav
        run: >
          cmake --preset ubuntu-ci-x86_64
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk"

      # THE compile check: this compiles the vendored ndi-source.cpp / ndi-output.cpp /
      # ndi-burn-filter.cpp / plugin-main.cpp with gcc/g++ on Linux — including every
      # non-Windows fallback branch (dlsym/clock_gettime/gethostname) the genlock patches
      # carry, which MSVC on the Windows builds never exercises.
      - name: Compile-check DistroAV (build the plugin)
        working-directory: vendor/distroav
        run: cmake --build --preset ubuntu-ci-x86_64

      - name: Stage the compiled distroav.so (fast hot-swap artifact)
        run: |
          set -euo pipefail
          dll=$(find vendor/distroav -name 'distroav.so' -not -path '*/CMakeFiles/*' | head -1)
          if [ -z "$dll" ]; then echo "distroav.so not found after the plugin build"; exit 1; fi
          mkdir -p distroav-stage
          cp "$dll" distroav-stage/
          git rev-parse HEAD > distroav-stage/DISTROAV_BUILD_SHA.txt
          echo "staged distroav.so from: $dll ($(stat -c%s "$dll") bytes)"

      - name: Upload distroav.so (fast hot-swap)
        uses: actions/upload-artifact@v4
        with:
          name: distroav-linux-fast-so
          path: distroav-stage/
          if-no-files-found: error

      - name: Compile gate passed
        run: echo "#460 vendored OBS/DistroAV C++ compiled clean on Linux — pre-merge gate green."

  # The FULL production Linux artifact (per #460): a real, complete OBS (full Qt frontend + the
  # default bundled plugins) + the genlock-patched DistroAV — genuinely deployable to imag-nb by
  # #458, not just a compile-check stub. Gated behind the fast compile-check above so a trivial
  # C++ error fails in ~minutes rather than after this full build.
  linux-genlock-build:
    name: Full Linux genlock bundle (OBS + DistroAV, #460)
    needs: [linux-distroav-compile-check]
    # obs#1 (camera-box, 2026-11-02): imag is out of the fleet but used in summer; setup-imag.sh,
    # deploy-genlock-fleet.sh and manifest-autosource still read obs-genlock-linux-x86_64. Build it
    # on dispatch only, not on every push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.OBS_APT_PACKAGES }}

      # Same override flags as windows-genlock.yml's full build (browser off — imag-nb needs no
      # browser source; this also skips the CEF download entirely, the dominant cost on the
      # Windows build). Everything else stays at the ubuntu-ci preset default.
      - name: Configure OBS (ubuntu-ci preset + genlock build flags)
        working-directory: vendor/obs-studio
        run: >
          cmake --preset ubuntu-ci
          '-DOBS_VERSION_OVERRIDE=32.2.0'
          -DENABLE_WHATSNEW=OFF
          -DENABLE_AJA=OFF
          -DENABLE_VLC=ON
          -DENABLE_TEST_INPUT=OFF
          -DENABLE_BROWSER=OFF

      - name: Build OBS
        working-directory: vendor/obs-studio
        run: cmake --build build_ubuntu --parallel

      - name: Install OBS SDK prefix (+ Development component, the #392 trick)
        working-directory: vendor/obs-studio
        run: |
          cmake --install build_ubuntu --prefix "$GITHUB_WORKSPACE/obs-sdk"
          cmake --install build_ubuntu --prefix "$GITHUB_WORKSPACE/obs-sdk" --component Development

      - name: Configure DistroAV against the genlocked OBS SDK
        working-directory: vendor/distroav
        run: >
          cmake --preset ubuntu-ci-x86_64
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk"

      - name: Build DistroAV
        working-directory: vendor/distroav
        run: cmake --build --preset ubuntu-ci-x86_64

      # cmake/linux/defaults.cmake: OBS_OUTPUT_DIR = build_ubuntu/rundir, and every install
      # helper copies into "${OBS_OUTPUT_DIR}/$<CONFIG>/..." at build time (same nested-by-config
      # layout as Windows) — so the real rundir is build_ubuntu/rundir/RelWithDebInfo. DistroAV is
      # built as a STANDALONE project (not an in-tree OBS plugin subdirectory), so its distroav.so
      # never lands in OBS's own rundir automatically — stage it in manually, same as
      # windows-genlock.yml does for distroav.dll.
      - name: Stage artifact (OBS rundir + distroav.so + data + build SHA)
        run: |
          set -euo pipefail
          rundir="vendor/obs-studio/build_ubuntu/rundir/RelWithDebInfo"
          if [ ! -d "$rundir" ]; then echo "OBS rundir not found: $rundir"; exit 1; fi
          mkdir -p stage
          cp -a "$rundir"/. stage/

          distroav_so=$(find vendor/distroav -name 'distroav.so' -not -path '*/CMakeFiles/*' | head -1)
          if [ -z "$distroav_so" ]; then echo "distroav.so not found after the DistroAV build"; exit 1; fi

          # The binary obs-plugins dir (lib/<arch>/obs-plugins, holding the .so files) already
          # exists in the staged rundir because OBS's own default-enabled plugins (obs-x264,
          # obs-outputs, ...) were staged there — discover it rather than hardcode the multiarch
          # triplet (CMAKE_INSTALL_LIBDIR = lib/CMAKE_SYSTEM_PROCESSOR-linux-gnu).
          plugin_lib_dir=$(find stage -type d -path '*/obs-plugins' -not -path '*/share/*' | head -1)
          if [ -z "$plugin_lib_dir" ]; then
            echo "ERROR: no lib/obs-plugins dir found in the staged rundir — OBS_PLUGIN_DESTINATION layout changed?"
            exit 1
          fi
          cp "$distroav_so" "$plugin_lib_dir/"
          # issue 1425: the vendored vlc-video plugin (stamps on the OBS media clock) is built by the OBS build
          # (-DENABLE_VLC=ON, libvlc-dev headers); it loads libvlc from the installed VLC at runtime.
          if [ ! -f "$plugin_lib_dir/vlc-video.so" ]; then echo "ERROR: vlc-video.so not built (issue 1425)"; exit 1; fi

          # Data resources: OBS_DATA_DESTINATION = share/obs (cmake/linux/defaults.cmake), so a
          # plugin's data lands at share/obs/obs-plugins/<name>/ — mirror the source data/ dir
          # there directly (same as windows-genlock.yml copying vendor/distroav/data/* into
          # stage/data/obs-plugins/distroav/).
          data_root=$(find stage -type d -path '*/share/obs/obs-plugins' | head -1)
          if [ -z "$data_root" ]; then data_root="stage/share/obs/obs-plugins"; fi
          if [ -d "vendor/distroav/data" ]; then
            mkdir -p "$data_root/distroav"
            cp -a vendor/distroav/data/. "$data_root/distroav/"
          fi

          git rev-parse HEAD > stage/GENLOCK_BUILD_SHA.txt
          echo "staged distroav.so from: $distroav_so -> $plugin_lib_dir/"
          echo "staged OBS rundir from: $rundir"

      # issue 1317: record the apt packages the built bundle links against (Qt6 / ffmpeg / libOpenGL
      # runtime) so setup-strih.sh installs them on a fresh box. Written INTO stage/ BEFORE the
      # manifest step so genlock-manifest.sh --check accounts for it (an unlisted stage file fails the
      # self-consistency check). The runner that built the binary is the only authority on what it
      # links. Informative parity here (a re-provisioned imag-nb hits the same runtime gap).
      - name: Record runtime packages (#1317)
        run: scripts/genlock-runtime-packages.sh --stage stage --out stage/RUNTIME_PACKAGES.txt

      # #120: the per-component SHA manifest generator — reused UNCHANGED (cross-platform bash,
      # already unit-proven on the Linux `test` job via tests/genlock_manifest.rs).
      - name: Generate per-component SHA manifest (#120)
        run: scripts/genlock-manifest.sh --stage stage --out stage/BUNDLE_MANIFEST.json

      - name: Assert bundle manifest self-consistent (#120)
        run: scripts/genlock-manifest.sh --check stage/BUNDLE_MANIFEST.json --stage stage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-genlock-linux-x86_64
          path: stage/
          if-no-files-found: error


  # issue 1317: the strih-snv FULL build variant. The strih role needs the same full plugin set as
  # the imag-parity full build above (obs-websocket, obs-ffmpeg + NVENC, obs-x264, obs-outputs,
  # obs-filters, image-source, text-freetype2, linux-capture/v4l2, DistroAV) -- all ON in the
  # ubuntu-ci preset default (AJA/decklink/whatsnew off; VLC on since issue 1425), so this job copies the full build
  # byte-for-byte and differs ONLY by artifact name + a build-flags marker. The one plugin the strih
  # role additionally needs vs the imag artifact is obs-browser (the 4 browser sources: VDO.ninja
  # interkom, Ableset, camera crew, 1pixel). obs-browser needs CEF, which the vendored ubuntu-ci
  # preset does NOT auto-fetch on Linux (no cmake/linux/buildspec.cmake) -- so this variant fetches
  # the pinned obs-deps CEF itself (see the CEF steps below), sha256-verifies it, and passes
  # CEF_ROOT_DIR, with STRIH_ENABLE_BROWSER=ON (issue 1317). Flip that one env var to 'OFF' to drop
  # the browser sources again. The imag-parity linux-genlock-build job above is left byte-identical
  # (browser OFF -- imag needs no browser source).
  # obs#1 / camera-box#1485: the dante_input source's Rust side. fmt, clippy, the unit tests, and the
  # real device on a dummy interface (device_e2e: its UDP ports bound while it runs, the status line,
  # the ports free after stop), all under the coverage gate.
  dante-input-ffi:
    name: dante-input FFI (fmt, clippy, tests, device on a dummy iface, coverage)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins/dante-input/ffi
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: VERSION matches the dante-input crate version
        # v0.4.15 was tagged with VERSION still at 0.4.14 and never published.
        run: |
          set -euo pipefail
          want="$(tr -d '[:space:]' < ../../../VERSION)"
          got="$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json,sys;print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="dante-input-ffi"))')"
          if [ "$want" != "$got" ]; then echo "ERROR: VERSION says $want, Cargo.toml says $got"; exit 1; fi
          echo "version $want"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: A dummy interface for the device test
        run: |
          set -euo pipefail
          sudo ip link add dante0 type dummy
          sudo ip addr add 10.99.0.1/24 dev dante0
          sudo ip link set dante0 up
          ip -4 addr show dante0
      - name: Tests and the device test, under the coverage gate
        env:
          DANTE_INPUT_TEST_IFACE: dante0
          DANTE_INPUT_TEST_IP: 10.99.0.1
        run: cargo llvm-cov --locked --fail-under-lines ${{ vars.COVERAGE_THRESHOLD || '60' }} -- --nocapture

  # obs#1 (section C point 6): the vendored-source regression guards moved from camera-box. A Rust
  # test crate (tests/vendored) of std-only integration tests: source anchors on vendor/**, and
  # harnesses that lift vendored C into tests/c programs and compile them with cc/g++.
  # jxs_strih_build_1387 reads the pinned vstack crates, so vstack is checked out like the strih job.
  vendored-tests:
    name: Vendored-source tests (tests/vendored)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the harness dependencies (apt)
        # libjansson-dev: drm_output_outputs_1424 links the lifted config grammar against jansson.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libjansson-dev
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check out vstack at the pin
        uses: ./.github/actions/vstack-checkout
      - name: Format
        working-directory: tests/vendored
        run: cargo fmt --check
      - name: Clippy
        working-directory: tests/vendored
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        # tests/support/vstack.rs checks that VSTACK_SRC is the commit vstack.pin names.
        working-directory: tests/vendored
        env:
          VSTACK_SRC: ${{ github.workspace }}/vstack
        run: |
          set -euo pipefail
          cargo test --locked --no-fail-fast 2>&1 | tee vendored-tests.log
          # a test camera-box ran must run here: none ignored, none filtered, no empty test binary
          if grep -E '^test result: .* [1-9][0-9]* (ignored|filtered out)' vendored-tests.log; then
            echo "ERROR: a vendored test was ignored or filtered out"; exit 1
          fi
          if grep -E '^running 0 tests' vendored-tests.log; then
            echo "ERROR: a vendored test binary ran no test"; exit 1
          fi

  linux-genlock-build-strih:
    name: Full Linux genlock bundle -- strih variant (issue 1317)
    needs: [linux-distroav-compile-check, dante-input-ffi]
    # issue 1317 (owner ROZHODNUTÉ 18.9.): the strih-snv notebook runs Ubuntu 26.04 (resolute) --
    # noble's ffmpeg/Qt sonames (libavcodec60 / Qt 6.4) do not exist there, so the strih bundle must
    # be built on the 26.04 runner or it cannot load on the box. ONLY this job moves; the imag-parity
    # full build (linux-genlock-build) and the DistroAV compile-check stay on ubuntu-24.04 (imag-nb
    # noble). `runs-on` cannot read job env, so this literal is pinned EQUAL to STRIH_TARGET_RELEASE
    # below by tests/linux_genlock_workflow_gate.rs.
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      # issue 1317: obs-browser + CEF ARE wired below (the CEF fetch/verify/extract step). Flip to
      # 'OFF' to drop the browser sources again -- that is the ONLY change needed (the fetch step and
      # the CEF_ROOT_DIR arg are both gated on this value, and the STRIH_BUILD_FLAGS marker follows).
      STRIH_ENABLE_BROWSER: 'ON'
      # issue 1317: the Ubuntu release this strih bundle is built on -- the SINGLE SOURCE for the
      # STRIH_BUILD_FLAGS `TARGET-RELEASE:` marker line (the Stage step reads $STRIH_TARGET_RELEASE).
      # MUST stay equal to the `runs-on:` literal above (runs-on can't read job env, so a test pins
      # them together); verify-strih.sh fails closed if the installed bundle's marker != the box's
      # /etc/os-release VERSION_ID (a 24.04 bundle on a 26.04 box would crash OBS at load).
      STRIH_TARGET_RELEASE: 'ubuntu-26.04'
      # CEF pin -- MUST match vendor/obs-studio/CMakePresets.json configurePresets[dependencies]
      # .vendor."obsproject.com/obs-studio".dependencies.cef (ubuntu-x86_64). tests/python/
      # test_linux_genlock_strih_cef_1317.py::test_workflow_cef_hash_matches_vendored_pin guards drift.
      CEF_VERSION: '6533'
      CEF_ARCHIVE: 'cef_binary_6533_linux_x86_64_v6.tar.xz'
      CEF_SHA256: '7963335519a19ccdc5233f7334c5ab023026e2f3e9a0cc417007c09d86608146'
      CEF_BASE_URL: 'https://cdn-fastly.obsproject.com/downloads'
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.OBS_APT_PACKAGES }} nasm libclang-dev zstd xvfb  # obs#1: zstd packs the release bundle, xvfb gives the dante-input module test the X display libobs opens; issue 1387: nasm for SVT-JPEG-XS, libclang for the v4l2 sys crate's bindgen (the jxs-recv-ffi build below)

      # issue 1387 slice 2: DistroAV's JPEG XS source links the jxs-recv-ffi static library (a C ABI
      # over the JPEG XS crate's receive loop, the code jxs-recv-probe runs). rustc names the native
      # libraries a static library needs only when it builds one; the step hands that list to
      # DistroAV's CMake, so a new Rust dependency can never leave the plugin with an undefined symbol.
      - name: Install the Rust toolchain (issue 1387)
        uses: dtolnay/rust-toolchain@stable

      # camera-box#1487: the JPEG XS crates live in zbynekdrlik/vstack, checked out at vstack.pin's
      # tag and verified against its commit (sets VSTACK_TAG / VSTACK_COMMIT).
      - name: Check out vstack at the pin
        uses: ./.github/actions/vstack-checkout

      - name: Build the jxs-recv-ffi static library (issue 1387)
        # rustc prints the native-libs note in colour on the runner (run 40909341652), which the
        # `^note:` sed below cannot match; plain text only.
        working-directory: vstack
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          if ! cargo rustc --locked --release -p jxs-recv-ffi --crate-type staticlib -- --print native-static-libs 2> jxs-ffi-build.log; then
            cat jxs-ffi-build.log
            exit 1
          fi
          cat jxs-ffi-build.log
          libs="$(sed -n 's/^note: native-static-libs: //p' jxs-ffi-build.log | tail -1)"
          if [ -z "$libs" ]; then echo "ERROR: rustc printed no native-static-libs line (issue 1387)"; exit 1; fi
          if [ ! -f target/release/libjxs_recv_ffi.a ]; then echo "ERROR: target/release/libjxs_recv_ffi.a not built (issue 1387)"; exit 1; fi
          # issue 1387 slice 3: the ONE archive must carry the sender's C ABI too (jxs-recv-ffi pulls
          # jxs-send-ffi in), or the JPEG XS program output cannot link.
          # (nm exits non-zero on the archive's lib.rmeta member, which has no symbols: its stderr is
          # kept and shown when a symbol is missing)
          nm -g --defined-only target/release/libjxs_recv_ffi.a 2> jxs-ffi-nm.err > jxs-ffi-symbols.txt || true
          for sym in cbjxs_open cbjxs_send_open cbjxs_send_frame cbjxs_send_set_log; do
            if ! grep -qw "$sym" jxs-ffi-symbols.txt; then cat jxs-ffi-nm.err; echo "ERROR: libjxs_recv_ffi.a does not define $sym (issue 1387)"; exit 1; fi
          done
          echo "JXS_FFI_NATIVE_LIBS=$libs" >> "$GITHUB_ENV"
          echo "jxs-recv-ffi: $(stat -c%s target/release/libjxs_recv_ffi.a) bytes, native libs: $libs"

      # issue 1317: fetch the EXACT obs-deps CEF the vendored OBS pins so obs-browser links against
      # it. The vendored ubuntu-ci preset does NOT auto-fetch CEF on Linux (no cmake/linux/
      # buildspec.cmake -- only macos/windows call _check_dependencies), so we do it the same way
      # upstream OBS's own Linux CI does: download the pinned tarball, sha256-verify, extract, and
      # hand FindCEF.cmake a CEF_ROOT_DIR. Cached by version+hash so the ~325 MB download is paid once.
      - name: Cache CEF binary distribution (issue 1317)
        if: env.STRIH_ENABLE_BROWSER == 'ON'
        uses: actions/cache@v4
        with:
          path: cef-dl/${{ env.CEF_ARCHIVE }}
          key: cef-${{ env.CEF_VERSION }}-${{ env.CEF_SHA256 }}

      - name: Fetch + verify + extract CEF (issue 1317)
        if: env.STRIH_ENABLE_BROWSER == 'ON'
        run: |
          set -euo pipefail
          mkdir -p cef-dl cef-root
          archive="cef-dl/${CEF_ARCHIVE}"
          if [ ! -f "$archive" ]; then
            echo "Downloading ${CEF_BASE_URL}/${CEF_ARCHIVE}"
            curl -fSL --retry 3 -o "$archive" "${CEF_BASE_URL}/${CEF_ARCHIVE}"
          else
            echo "CEF archive restored from cache: $archive"
          fi
          echo "${CEF_SHA256}  ${archive}" | sha256sum -c -
          tar -xf "$archive" -C cef-root
          # The tarball extracts to a top-level cef_binary_<ver>_linux_x86_64[_v<rev>]/ dir -- point
          # CEF_ROOT_DIR at THAT dir (never its parent), located by name so the _v<rev> suffix never
          # has to be guessed. Absolute path so it survives the OBS configure step's working-directory.
          cef_dir="$(find "$PWD/cef-root" -maxdepth 1 -type d -name 'cef_binary_*' | head -1)"
          if [ -z "$cef_dir" ]; then echo "ERROR: extracted CEF top dir not found under cef-root"; exit 1; fi
          echo "CEF_ROOT_DIR=$cef_dir" >> "$GITHUB_ENV"
          echo "resolved CEF_ROOT_DIR=$cef_dir"

      - name: Configure OBS (ubuntu-ci preset + genlock build flags, strih variant)
        working-directory: vendor/obs-studio
        run: >
          cmake --preset ubuntu-ci
          '-DOBS_VERSION_OVERRIDE=32.2.0'
          -DENABLE_WHATSNEW=OFF
          -DENABLE_AJA=OFF
          -DENABLE_VLC=ON
          -DENABLE_TEST_INPUT=OFF
          -DENABLE_BROWSER=${{ env.STRIH_ENABLE_BROWSER }}
          -DCEF_ROOT_DIR=${{ env.CEF_ROOT_DIR }}

      - name: Build OBS
        working-directory: vendor/obs-studio
        run: cmake --build build_ubuntu --parallel

      - name: Install OBS SDK prefix (+ Development component, the #392 trick)
        working-directory: vendor/obs-studio
        run: |
          cmake --install build_ubuntu --prefix "$GITHUB_WORKSPACE/obs-sdk"
          cmake --install build_ubuntu --prefix "$GITHUB_WORKSPACE/obs-sdk" --component Development

      - name: Configure DistroAV against the genlocked OBS SDK
        working-directory: vendor/distroav
        run: >
          cmake --preset ubuntu-ci-x86_64
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk"
          -DCAMERA_BOX_JXS_SOURCE=ON
          -DCAMERA_BOX_JXS_FFI_LIB="$GITHUB_WORKSPACE/vstack/target/release/libjxs_recv_ffi.a"
          -DCAMERA_BOX_JXS_FFI_INCLUDE="$GITHUB_WORKSPACE/vstack/jxs/recv-ffi/include"
          -DCAMERA_BOX_JXS_SEND_FFI_INCLUDE="$GITHUB_WORKSPACE/vstack/jxs/send-ffi/include"
          -DCAMERA_BOX_JXS_FFI_NATIVE_LIBS="$JXS_FFI_NATIVE_LIBS"

      - name: Build DistroAV
        working-directory: vendor/distroav
        run: cmake --build --preset ubuntu-ci-x86_64

      # issue 1439: a Linux stream box takes the console's VBAN program stream straight into the
      # vendored obs-vban SOURCE (receive timeline + fixed reserve, stamped for the genlock ASRC):
      # no intercom hub, never PipeWire. Built against the genlocked SDK like DistroAV; the
      # imag-parity bundle consumes no VBAN and stays without it.
      - name: Configure obs-vban against the genlocked OBS SDK (issue 1439)
        working-directory: vendor/obs-vban
        run: >
          cmake -B build_ubuntu
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk"
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build obs-vban (issue 1439)
        working-directory: vendor/obs-vban
        run: cmake --build build_ubuntu --parallel

      # issue 1470: the camera-box A/V-sync dock (vendor/av-sync-dock: the lock / offset / latency
      # display, the mbc ASRC readout, the diag + LOCK-CORRECT SUGGESTED lines the av-step watchdog
      # reads) on the Linux stream box -- the Windows bundle always carried it (windows-genlock.yml
      # "Configure/Build av-sync-dock (#188)"). Built against the SAME genlocked SDK: libobs +
      # obs-frontend-api (the Development component installed above) + the system Qt6 Widgets OBS
      # itself links. The dock's source anchors are OS-independent text checks that already run on
      # every push in ci.yml (the tests/av_sync_dock_*.rs twins of the windows-genlock pwsh dock
      # steps), so this job adds what they cannot prove: the dock COMPILES and LINKS with gcc on Linux
      # (its CMakeLists links with -Wl,-z,defs, so an unresolved symbol fails here).
      - name: Configure av-sync-dock against the genlocked OBS SDK (issue 1470)
        working-directory: vendor/av-sync-dock
        run: >
          cmake -B build_ubuntu
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk"
          -DQT_VERSION=6
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build av-sync-dock (issue 1470)
        working-directory: vendor/av-sync-dock
        run: cmake --build build_ubuntu --parallel

      # camera-box#1436 (owner 4.11.2026): the stream operator's LUFS meter (vendor/obs-loudness-dock,
      # norihiro 0.5.1: EBU R128 momentary / short-term / integrated, LRA, true peak) -- the Windows
      # stream OBS had one, the Linux bundle lost it. Same genlocked SDK and system Qt6 as the A/V-sync
      # dock; upstream links with -Wl,-z,defs. Upstream uses a system libebur128 only when pkg-config finds
      # one; the runner has none, and the staging step fails if the .so links one (the box must need no
      # libebur128 package). PkgConfig stays on: Qt6Gui's FindXKB needs it.
      - name: Configure obs-loudness-dock against the genlocked OBS SDK (camera-box#1436)
        working-directory: vendor/obs-loudness-dock
        run: >
          cmake -B build_ubuntu
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk"
          -DQT_VERSION=6
          -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build obs-loudness-dock (camera-box#1436)
        working-directory: vendor/obs-loudness-dock
        run: cmake --build build_ubuntu --parallel

      # camera-box#1436: the vendored libebur128 the dock meters with reads the EBU Tech 3341 reference
      # (1 kHz, -23 dBFS stereo) as -23 LUFS momentary / short-term / integrated and ~-23 dBTP.
      # camera-box#1387 (strih-snv reboot 4.11.2026): the JPEG XS program output retries a wanted start
      # every 2 s (OBS before the network: "Network is unreachable", never tried again) -- its pure
      # decisions (vendor/distroav/src/jxs-output-decide.h).
      - name: Test the JPEG XS output start retry (camera-box#1387)
        working-directory: tests/jxs-output-retry
        run: |
          set -euo pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          build/jxs-output-retry

      - name: Test the loudness meter against the EBU reference (camera-box#1436)
        working-directory: tests/loudness-ebur128
        run: |
          set -euo pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          build/ebur128-reference
          # The dock's only ebur128_init call (a code line, not a comment) passes the shared mode the test ran.
          calls="$(grep -v '^[[:space:]]*\(//\|/\*\|\*\)' ../../vendor/obs-loudness-dock/src/*.c ../../vendor/obs-loudness-dock/src/*.cpp | grep -c 'ebur128_init(' || true)"
          good="$(grep -v '^[[:space:]]*\(//\|/\*\|\*\)' ../../vendor/obs-loudness-dock/src/loudness.c | grep -c 'ebur128_init(.*LOUDNESS_DOCK_EBUR128_MODE)' || true)"
          if [ "$calls" != 1 ] || [ "$good" != 1 ]; then echo "ERROR: want one ebur128_init in the dock, passing LOUDNESS_DOCK_EBUR128_MODE (calls=$calls good=$good, camera-box#1436)"; exit 1; fi

      # obs#1 / camera-box#1485: the dante_input source. Its Rust device (dlink, pinned dstack tag in
      # plugins/dante-input/ffi/Cargo.toml) is a static library; rustc names its native libraries.
      - name: Build the dante-input FFI static library (obs#1)
        working-directory: plugins/dante-input/ffi
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          if ! cargo rustc --locked --release --lib --crate-type staticlib -- --print native-static-libs 2> ffi-build.log; then
            cat ffi-build.log
            exit 1
          fi
          cat ffi-build.log
          libs="$(sed -n 's/^note: native-static-libs: //p' ffi-build.log | tail -1)"
          if [ -z "$libs" ]; then echo "ERROR: rustc printed no native-static-libs line"; exit 1; fi
          if [ ! -f target/release/libdante_input_ffi.a ]; then echo "ERROR: libdante_input_ffi.a not built"; exit 1; fi
          echo "DANTE_INPUT_FFI_NATIVE_LIBS=$libs" >> "$GITHUB_ENV"

      - name: Configure and build the dante-input source (obs#1)
        working-directory: plugins/dante-input
        run: |
          set -euo pipefail
          cmake -B build_ubuntu -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DDANTE_INPUT_FFI_LIB="$GITHUB_WORKSPACE/plugins/dante-input/ffi/target/release/libdante_input_ffi.a" \
            -DDANTE_INPUT_FFI_NATIVE_LIBS="$DANTE_INPUT_FFI_NATIVE_LIBS"
          cmake --build build_ubuntu --parallel
          so=build_ubuntu/dante-input.so
          if [ ! -f "$so" ]; then echo "ERROR: $so not built"; exit 1; fi
          exports="$(nm -D --defined-only "$so" | awk '{print $3}' | sort)"
          echo "$exports"
          for sym in obs_module_load obs_module_unload obs_module_name; do
            if ! grep -qx "$sym" <<< "$exports"; then echo "ERROR: $so does not export $sym"; exit 1; fi
          done
          if grep -E '^_ZN|^_R|^dante_input_' <<< "$exports"; then echo "ERROR: $so exports its Rust symbols (want them private)"; exit 1; fi
          stack="$(readelf -lW "$so" | awk '$1 == "GNU_STACK" {print $7}')"
          if [ "$stack" != "RW" ]; then echo "ERROR: $so GNU_STACK flags '$stack', want RW"; exit 1; fi
          echo "dante-input.so: $(stat -c%s "$so") bytes, GNU_STACK $stack"

      # obs#1: the module through real libobs: no config = no kind and no device; a config with an
      # interface the box lacks = the kind, no device, the error line; a config on a dummy interface =
      # the device runs, a source is created and destroyed, unload stops the device cleanly.
      - name: Test the dante-input module through libobs (obs#1)
        working-directory: plugins/dante-input
        run: |
          set -euo pipefail
          libobs="$(find "$GITHUB_WORKSPACE/obs-sdk" -name 'libobs.so*' -type f | head -1)"
          if [ -z "$libobs" ]; then echo "ERROR: no libobs.so in obs-sdk"; exit 1; fi
          export LD_LIBRARY_PATH="$(dirname "$libobs")"
          so="$PWD/build_ubuntu/dante-input.so"
          test_bin="$PWD/build_ubuntu/dante-input-module-test"
          sudo ip link add dante0 type dummy
          sudo ip addr add 10.99.0.1/24 dev dante0
          sudo ip link set dante0 up
          for mode in absent bad-iface running; do
            home="$RUNNER_TEMP/home-$mode"
            mkdir -p "$home"
            case "$mode" in
              bad-iface) iface=nosuch0 ;;
              running) iface=dante0 ;;
              *) iface="" ;;
            esac
            if [ -n "$iface" ]; then
              mkdir -p "$home/.camera-box"
              printf 'name = "obs-ci"\niface = "%s"\nnetwork_rate = 96000\nrx = ["Master L", "Master R"]\narc_port = 24440\ncmc_port = 28800\nflows_port = 24455\nrx_port_base = 47200\n' "$iface" > "$home/.camera-box/dante-input.toml"
            fi
            echo "== $mode"
            HOME="$home" xvfb-run -a "$test_bin" "$so" "$mode"
          done

      # camera-box#1387 (obs#1): texture encoding across recordings through real libobs and
      # libobs-opengl: one encode thread for both, a stop that takes no graphics, no stale frame in
      # the second recording, a waiting graphics task that never hangs without a graphics thread.
      # obs#31: an encode error stops the recording (no encode-thread self-wait) and the next one encodes.
      - name: Test libobs texture encoding across recordings (camera-box#1387, obs#31)
        working-directory: tests/libobs-gpu-encode
        run: |
          set -euo pipefail
          libobs="$(find "$GITHUB_WORKSPACE/obs-sdk" -name 'libobs.so*' -type f | head -1)"
          if [ -z "$libobs" ]; then echo "ERROR: no libobs.so in obs-sdk"; exit 1; fi
          data="$GITHUB_WORKSPACE/obs-sdk/share/obs/libobs"
          if [ ! -f "$data/default.effect" ]; then echo "ERROR: no libobs effects in $data"; exit 1; fi
          cmake -B build -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk" -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          export LD_LIBRARY_PATH="$(dirname "$libobs")"
          xvfb-run -a build/gpu-encode-test "$data/"

      # camera-box#1387 (obs#1): obs-websocket's GL work (GetSourceScreenshot, CreateSceneItem) runs
      # on the graphics thread, not on the plugin's Qt pool thread (a fresh pool thread's first GL
      # MakeCurrent under the graphics lock cost a JPEG XS frame).
      - name: Test obs-websocket graphics on the graphics thread (camera-box#1387)
        working-directory: tests/obs-websocket-graphics
        run: |
          set -euo pipefail
          libobs="$(find "$GITHUB_WORKSPACE/obs-sdk" -name 'libobs.so*' -type f | head -1)"
          if [ -z "$libobs" ]; then echo "ERROR: no libobs.so in obs-sdk"; exit 1; fi
          data="$GITHUB_WORKSPACE/obs-sdk/share/obs/libobs"
          if [ ! -f "$data/default.effect" ]; then echo "ERROR: no libobs effects in $data"; exit 1; fi
          cmake -B build -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk" -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          export LD_LIBRARY_PATH="$(dirname "$libobs")"
          xvfb-run -a build/ws-graphics-test "$data/"

      # camera-box issue 1495 (stream-snv 9.11.2026): the A/V-sync dock let go of a removed `mbc`
      # neither at its 5 s lookup nor at the removal, so it was never destroyed and CreateInput refused
      # the name until OBS restarted. The dock's hold (camera-box-measure-hold.hpp) through real libobs.
      - name: Test the A/V-sync dock lets go of a removed source (camera-box issue 1495)
        working-directory: tests/av-sync-measure-hold
        run: |
          set -euo pipefail
          libobs="$(find "$GITHUB_WORKSPACE/obs-sdk" -name 'libobs.so*' -type f | head -1)"
          if [ -z "$libobs" ]; then echo "ERROR: no libobs.so in obs-sdk"; exit 1; fi
          cmake -B build -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-sdk" -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          export LD_LIBRARY_PATH="$(dirname "$libobs")"
          xvfb-run -a build/measure-hold-test
          # The dock uses it: the refresh filters its lookup, and the remove handler is connected in
          # st_create and disconnected in st_destroy (code lines, not comments).
          src=../../vendor/av-sync-dock/src
          code() { grep -v '^[[:space:]]*\(//\|/\*\|\*\)' "$@"; }
          need() { if [ "$(code "$1" | grep -cF "$2" || true)" != 1 ]; then echo "ERROR: want one '$2' in $1 (camera-box issue 1495)"; exit 1; fi; }
          need "$src/sync-test-output-video.cpp" 'src = camerabox::cb_measure_source_if_live(src);'
          need "$src/sync-test-output.cpp" 'signal_handler_connect(obs_get_signal_handler(), "source_remove", cb_measure_source_removed, st);'
          need "$src/sync-test-output.cpp" 'signal_handler_disconnect(obs_get_signal_handler(), "source_remove", cb_measure_source_removed, st);'
          need "$src/sync-test-output-measure.cpp" 'camerabox::cb_measure_hold_drop_removed(st->cb_measure_src_mutex, st->cb_measure_src, removed)'

      - name: Stage artifact (OBS rundir + distroav.so + data + build SHA + strih flags marker)
        run: |
          set -euo pipefail
          rundir="vendor/obs-studio/build_ubuntu/rundir/RelWithDebInfo"
          if [ ! -d "$rundir" ]; then echo "OBS rundir not found: $rundir"; exit 1; fi
          mkdir -p stage
          cp -a "$rundir"/. stage/

          distroav_so=$(find vendor/distroav -name 'distroav.so' -not -path '*/CMakeFiles/*' | head -1)
          if [ -z "$distroav_so" ]; then echo "distroav.so not found after the DistroAV build"; exit 1; fi

          # issue 1387 slice 2: the strih distroav.so carries the JPEG XS source, and its stack is not
          # executable (SVT's nasm objects would mark it so without -z noexecstack, and glibc 2.41+
          # on the 26.04 box then refuses to load the plugin).
          if ! grep -aq 'camera_box_jxs_source' "$distroav_so"; then echo "ERROR: $distroav_so has no camera_box_jxs_source (issue 1387)"; exit 1; fi
          # issue 1387 slice 3: and the JPEG XS program output
          if ! grep -aq 'camera_box_jxs_output' "$distroav_so"; then echo "ERROR: $distroav_so has no camera_box_jxs_output (issue 1387)"; exit 1; fi
          stack="$(readelf -lW "$distroav_so" | awk '$1 == "GNU_STACK" {print $7}')"
          if [ "$stack" != "RW" ]; then echo "ERROR: $distroav_so GNU_STACK flags '$stack', want RW (issue 1387)"; exit 1; fi
          echo "distroav.so carries the JPEG XS source, GNU_STACK $stack (issue 1387)"

          plugin_lib_dir=$(find stage -type d -path '*/obs-plugins' -not -path '*/share/*' | head -1)
          if [ -z "$plugin_lib_dir" ]; then
            echo "ERROR: no lib/obs-plugins dir found in the staged rundir"
            exit 1
          fi
          cp "$distroav_so" "$plugin_lib_dir/"
          # issue 1439: the vendored obs-vban (the VBAN receive source) next to DistroAV.
          vban_so=$(find vendor/obs-vban/build_ubuntu -name 'obs-vban.so' -not -path '*/CMakeFiles/*' | head -1)
          if [ -z "$vban_so" ]; then echo "ERROR: obs-vban.so not found after the obs-vban build (issue 1439)"; exit 1; fi
          cp "$vban_so" "$plugin_lib_dir/"
          # issue 1470: the camera-box A/V-sync dock next to obs-vban (the stream role's dock, verify-strih item 47).
          dock_so=$(find vendor/av-sync-dock/build_ubuntu -name 'obs-audio-video-sync-dock.so' -not -path '*/CMakeFiles/*' | head -1)
          if [ -z "$dock_so" ]; then echo "ERROR: obs-audio-video-sync-dock.so not found after the av-sync-dock build (issue 1470)"; exit 1; fi
          if ! nm -D --defined-only "$dock_so" | grep -w obs_module_load >/dev/null; then echo "ERROR: $dock_so exports no obs_module_load -- OBS would not load it (issue 1470)"; exit 1; fi
          cp "$dock_so" "$plugin_lib_dir/"
          # camera-box#1436: the loudness dock (dock id net.nagater.obs-loudness-dock..main -- upstream's
          # ID_PREFIX ends in '.' and it appends '.main'; camera-box seeds that dock open on the stream role).
          loud_so=$(find vendor/obs-loudness-dock/build_ubuntu -name 'loudness-dock.so' -not -path '*/CMakeFiles/*' | head -1)
          if [ -z "$loud_so" ]; then echo "ERROR: loudness-dock.so not found after the obs-loudness-dock build (camera-box#1436)"; exit 1; fi
          if ! nm -D --defined-only "$loud_so" | grep -w obs_module_load >/dev/null; then echo "ERROR: $loud_so exports no obs_module_load -- OBS would not load it (camera-box#1436)"; exit 1; fi
          if ! strings "$loud_so" | grep -Fx 'net.nagater.obs-loudness-dock..main' >/dev/null; then echo "ERROR: $loud_so does not carry the dock id camera-box seeds (camera-box#1436)"; exit 1; fi
          if ldd "$loud_so" | grep ebur128 >/dev/null; then echo "ERROR: $loud_so links a system libebur128, not the vendored one (camera-box#1436)"; exit 1; fi
          cp "$loud_so" "$plugin_lib_dir/"
          # obs#1 / camera-box#1485: the dante_input source (no device and no source kind without
          # ~/.camera-box/dante-input.toml on the box).
          cp plugins/dante-input/build_ubuntu/dante-input.so "$plugin_lib_dir/"
          # issue 1425: the vendored vlc-video plugin (stamps on the OBS media clock) is built by the OBS build
          # (-DENABLE_VLC=ON, libvlc-dev headers); it loads libvlc from the installed VLC at runtime.
          if [ ! -f "$plugin_lib_dir/vlc-video.so" ]; then echo "ERROR: vlc-video.so not built (issue 1425)"; exit 1; fi

          data_root=$(find stage -type d -path '*/share/obs/obs-plugins' | head -1)
          if [ -z "$data_root" ]; then data_root="stage/share/obs/obs-plugins"; fi
          if [ -d "vendor/distroav/data" ]; then
            mkdir -p "$data_root/distroav"
            cp -a vendor/distroav/data/. "$data_root/distroav/"
          fi
          mkdir -p "$data_root/obs-vban"
          cp -a vendor/obs-vban/data/. "$data_root/obs-vban/"
          echo "staged obs-vban.so from: $vban_so -> $plugin_lib_dir/"
          mkdir -p "$data_root/obs-audio-video-sync-dock"
          cp -a vendor/av-sync-dock/data/. "$data_root/obs-audio-video-sync-dock/"
          if [ ! -f "$data_root/obs-audio-video-sync-dock/locale/en-US.ini" ]; then echo "ERROR: the dock locale did not stage (issue 1470)"; exit 1; fi
          echo "staged obs-audio-video-sync-dock.so from: $dock_so -> $plugin_lib_dir/"
          mkdir -p "$data_root/loudness-dock"
          cp -a vendor/obs-loudness-dock/data/. "$data_root/loudness-dock/"
          if [ ! -f "$data_root/loudness-dock/locale/en-US.ini" ]; then echo "ERROR: the loudness dock locale did not stage (camera-box#1436)"; exit 1; fi
          echo "staged loudness-dock.so from: $loud_so -> $plugin_lib_dir/"

          git rev-parse HEAD > stage/GENLOCK_BUILD_SHA.txt
          # obs#1 point 3: OBS_RELEASE.txt names the release tag (a dev build says tag=none), the obs
          # commit and VERSION. Written before the manifest so the manifest lists it.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then rel_tag="$GITHUB_REF_NAME"; else rel_tag="none"; fi
          printf 'tag=%s\ncommit=%s\nversion=%s\n' "$rel_tag" "$(git rev-parse HEAD)" "$(tr -d '[:space:]' < VERSION)" > stage/OBS_RELEASE.txt
          cat stage/OBS_RELEASE.txt
          # issue 1317: the strih variant's build-flags marker -- written INTO the stage BEFORE the
          # manifest step so genlock-manifest.sh --check accounts for it (an unlisted file in stage
          # would fail the manifest self-consistency check). Env-conditional so a flip of
          # STRIH_ENABLE_BROWSER is the ONLY change: ON => a truthful BROWSER-ON marker (which
          # verify-strih.sh's browser-bundle gate reads), OFF => the original BROWSER-OFF text.
          if [ "$STRIH_ENABLE_BROWSER" = "ON" ]; then
            marker="BROWSER-ON: obs-browser + CEF ${CEF_VERSION}"
          else
            marker="BROWSER-OFF: obs-browser/CEF not built (flip STRIH_ENABLE_BROWSER=ON to build it, issue 1317)"
          fi
          # issue 1317: the TARGET-RELEASE line records the Ubuntu release this bundle was BUILT on
          # (single-sourced from the STRIH_TARGET_RELEASE job env, pinned equal to runs-on). verify-strih.sh
          # + setup-strih.sh fail closed if this != the box's /etc/os-release VERSION_ID.
          printf 'variant=strih\nENABLE_BROWSER=%s\n%s\nTARGET-RELEASE: %s\n' \
            "$STRIH_ENABLE_BROWSER" "$marker" "$STRIH_TARGET_RELEASE" > stage/STRIH_BUILD_FLAGS.txt
          echo "staged strih variant (ENABLE_BROWSER=$STRIH_ENABLE_BROWSER, TARGET-RELEASE=$STRIH_TARGET_RELEASE)"

      # issue 1317: record the apt packages the built strih bundle links against (Qt6 / ffmpeg /
      # libOpenGL runtime) into RUNTIME_PACKAGES.txt so setup-strih.sh installs them on the fresh
      # 26.04 box BEFORE the bundle -- the fix for the 13-soname `libavcodec.so.62` load failure.
      # Written INTO stage/ BEFORE the manifest step so genlock-manifest.sh --check accounts for it.
      # `--extra qt6-wayland`: OBS DLOPENS its Qt Wayland platform plugin at runtime (ldd cannot see
      # it), so it is FORCED into the list -- without it OBS aborts on 26.04 GNOME with
      # `Could not find the Qt platform plugin "wayland"` (the strih box is Wayland, unlike imag).
      - name: Record runtime packages (#1317)
        run: scripts/genlock-runtime-packages.sh --stage stage --out stage/RUNTIME_PACKAGES.txt --extra qt6-wayland

      - name: Generate per-component SHA manifest (#120)
        run: scripts/genlock-manifest.sh --stage stage --out stage/BUNDLE_MANIFEST.json

      - name: Assert bundle manifest self-consistent (#120)
        run: scripts/genlock-manifest.sh --check stage/BUNDLE_MANIFEST.json --stage stage

      # obs#1 point 2: the release fields go into BUNDLE_MANIFEST.json as one "release" line right
      # after the opening brace. genlock-manifest.sh --check reads the files[] entries line by line,
      # so the rest of the file keeps its exact layout; the re-check below proves it.
      - name: Add the release fields to BUNDLE_MANIFEST.json (obs#1)
        run: |
          set -euo pipefail
          abi="$(grep -rhoE '#define[[:space:]]+CBJXS_ABI_VERSION[[:space:]]+[0-9]+' vstack/jxs/recv-ffi/include vstack/jxs/send-ffi/include | awk '{print $3}' | sort -u)"
          if [ "$(printf '%s\n' "$abi" | grep -c .)" != 1 ]; then echo "ERROR: want one CBJXS_ABI_VERSION in the vstack headers, got: '$abi'"; exit 1; fi
          stats="$(sed -n 's/^#define OBS_GENLOCK_STATS_VERSION \([0-9]\+\)$/\1/p' vendor/obs-studio/libobs/obs.h)"
          out_stats="$(sed -n 's/^#define OBS_GENLOCK_OUTPUT_STATS_VERSION \([0-9]\+\)$/\1/p' vendor/obs-studio/libobs/obs.h)"
          vban="$(sed -n 's/^project(obs-vban VERSION \([0-9.]\+\))$/\1/p' vendor/obs-vban/CMakeLists.txt)"
          dock="$(sed -n 's/^project(obs-audio-video-sync-dock VERSION \([0-9.]\+\))$/\1/p' vendor/av-sync-dock/CMakeLists.txt)"
          loudness="$(sed -n 's/^project(loudness-dock VERSION \([0-9.]\+\))$/\1/p' vendor/obs-loudness-dock/CMakeLists.txt)"
          obs="$(jq -r '.components[] | select(.name == "obs-studio") | .pinned_version' stage/BUNDLE_MANIFEST.json)"
          distroav="$(jq -r '.components[] | select(.name == "distroav") | .pinned_version' stage/BUNDLE_MANIFEST.json)"
          for v in stats out_stats vban dock loudness obs distroav; do
            if [ -z "${!v}" ] || [ "${!v}" = "null" ]; then echo "ERROR: could not read $v"; exit 1; fi
          done
          release="$(jq -cn \
            --arg tag "$(sed -n 's/^tag=//p' stage/OBS_RELEASE.txt)" \
            --arg commit "$(git rev-parse HEAD)" \
            --arg version "$(tr -d '[:space:]' < VERSION)" \
            --arg obs "$obs" --arg distroav "$distroav" \
            --arg vban "$vban" --arg dock "$dock" --arg loudness "$loudness" \
            --arg vstack_tag "$VSTACK_TAG" --arg vstack_commit "$VSTACK_COMMIT" \
            --argjson stats "$stats" --argjson out_stats "$out_stats" \
            --arg obs_h "$(sha256sum vendor/obs-studio/libobs/obs.h | cut -d' ' -f1)" \
            --argjson abi "$abi" \
            '{obs_tag: $tag, obs_commit: $commit, obs_version: $version,
              versions: {"obs-studio": $obs, distroav: $distroav, "obs-vban": $vban, "av-sync-dock": $dock, "loudness-dock": $loudness},
              vstack_tag: $vstack_tag, vstack_commit: $vstack_commit,
              genlock_stats_version: $stats, genlock_output_stats_version: $out_stats,
              obs_h_sha256: $obs_h, cbjxs_abi_version: $abi}')"
          awk -v line="  \"release\": $release," 'NR == 1 {print; print line; next} {print}' stage/BUNDLE_MANIFEST.json > manifest.tmp
          mv manifest.tmp stage/BUNDLE_MANIFEST.json
          jq -e '.release.obs_commit and (.files | length > 0)' stage/BUNDLE_MANIFEST.json > /dev/null
          scripts/genlock-manifest.sh --check stage/BUNDLE_MANIFEST.json --stage stage
          jq '.release' stage/BUNDLE_MANIFEST.json

      - name: Upload artifact (strih variant)
        uses: actions/upload-artifact@v4
        with:
          name: obs-genlock-linux-x86_64-strih
          path: stage/
          if-no-files-found: error

      # obs#1 points 1 and 4: the release assets. The tarball keeps the file modes (an artifact zip
      # drops the executable bits). Runs on every build, so a dev push proves the packaging before a
      # tag exists; only publish-release uploads them to a release.
      - name: Package the release assets (obs#1)
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^tag=//p' stage/OBS_RELEASE.txt)"
          if [ "$tag" = "none" ]; then tag="dev-$(git rev-parse --short=12 HEAD)"; fi
          mkdir -p release
          bundle="obs-strih-linux-x86_64-$tag.tar.zst"
          tar -C stage -cf - . | zstd -q -T0 -10 -o "release/$bundle"
          # obs#1 point 4: the burn and QPSK headers camera-box's decoders read, plus obs.h.
          headers="obs-headers-$tag.tar.gz"
          tar -czf "release/$headers" \
            vendor/distroav/src/burn-geom.hpp vendor/distroav/src/burn-payload.hpp vendor/distroav/src/burn-tick-cache.hpp \
            vendor/av-sync-dock/src/camera-box-marker-scan.hpp vendor/av-sync-dock/src/camera-box-channel-pick.hpp \
            vendor/av-sync-dock/src/camera-box-qr.hpp vendor/av-sync-dock/src/camera-box-audio.hpp \
            vendor/av-sync-dock/src/sync-test-output-internal.hpp \
            vendor/obs-studio/libobs/obs.h
          cp stage/BUNDLE_MANIFEST.json stage/OBS_RELEASE.txt release/
          (cd release && for f in "$bundle" "$headers"; do sha256sum "$f" > "$f.sha256"; done && sha256sum -c ./*.sha256)
          # Read the bundle back: the obs binary must keep its executable bit, the manifest must match.
          mkdir unpack && zstd -dc "release/$bundle" | tar -C unpack -xf -
          obs_bin="$(find unpack -type f -name obs -path '*/bin/*' | head -1)"
          if [ -z "$obs_bin" ] || [ ! -x "$obs_bin" ]; then echo "ERROR: the unpacked bundle has no executable bin/obs"; exit 1; fi
          scripts/genlock-manifest.sh --check unpack/BUNDLE_MANIFEST.json --stage unpack
          ls -l release

      - name: Upload the release assets
        uses: actions/upload-artifact@v4
        with:
          name: obs-release-assets
          path: release/
          if-no-files-found: error
          compression-level: 0

  # obs#1 point 1: a release per tag vX.Y.Z from main. camera-box pins the tag + sha256.
  publish-release:
    name: Publish the release (tag vX.Y.Z on main)
    # a release also needs the vendored-source guards green (dante-input-ffi gates it via strih)
    needs: [linux-genlock-build-strih, vendored-tests]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag matches VERSION and is on main
        run: |
          set -euo pipefail
          want="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then echo "ERROR: tag $GITHUB_REF_NAME, VERSION says $want"; exit 1; fi
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "ERROR: tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then echo "ERROR: $GITHUB_SHA is not on main"; exit 1; fi
          echo "release $GITHUB_REF_NAME at $GITHUB_SHA"

      - name: Download the release assets
        uses: actions/download-artifact@v4
        with:
          name: obs-release-assets
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c ./*.sha256
          grep -qx "tag=$GITHUB_REF_NAME" OBS_RELEASE.txt
          grep -qx "commit=$GITHUB_SHA" OBS_RELEASE.txt
          bundle_sha="$(cut -d' ' -f1 obs-strih-linux-x86_64-"$GITHUB_REF_NAME".tar.zst.sha256)"
          printf 'Linux strih bundle %s (obs commit %s).\n\nobs-strih-linux-x86_64-%s.tar.zst sha256 %s\n\nRelease fields:\n```json\n%s\n```\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$bundle_sha" "$(jq '.release' BUNDLE_MANIFEST.json)" > notes.md
          # Named one by one: a `*.tar.*` glob also matches the .sha256 files, and a name given twice
          # fails the upload (v0.1.0, run 41545413697: HTTP 404 on the second copy).
          bundle="obs-strih-linux-x86_64-$GITHUB_REF_NAME.tar.zst"
          headers="obs-headers-$GITHUB_REF_NAME.tar.gz"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md \
            "$bundle" "$bundle.sha256" "$headers" "$headers.sha256" BUNDLE_MANIFEST.json OBS_RELEASE.txt
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[] | "\(.name) \(.size)"'
